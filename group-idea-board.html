<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Idea Board</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg,
        rgba(255, 255, 255, 0.4) 0%,
        rgba(240, 255, 240, 0.5) 25%,
        rgba(220, 255, 220, 0.4) 50%,
        rgba(200, 255, 200, 0.5) 75%,
        rgba(255, 255, 255, 0.4) 100%),
                linear-gradient(180deg,
        rgba(34, 139, 34, 0.08) 0%,
        rgba(50, 205, 50, 0.06) 30%,
        rgba(34, 139, 34, 0.04) 70%,
        rgba(50, 205, 50, 0.08) 100%),
                url('https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=1200&h=800&fit=crop&crop=center') no-repeat center center fixed;
    background-size: cover;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    position: relative;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

body::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(0.5px);
    -webkit-backdrop-filter: blur(0.5px);
    z-index: -1;
}

.container {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    width: 100%;
    max-width: 650px;
    padding: 40px;
    border-radius: 24px;
    box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.08),
        0 2px 8px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    margin-top: 20px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    position: relative;
    overflow: hidden;
}

.app-header {
    text-align: center;
    margin-bottom: 40px;
    padding-bottom: 30px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    position: relative;
}

.app-header::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, rgba(0, 122, 255, 0.3), rgba(52, 152, 219, 0.3));
    border-radius: 0.5px;
}

.logo {
    margin-bottom: 15px;
    filter: drop-shadow(0 2px 4px rgba(102, 126, 234, 0.3));
}

.header-content {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.app-header h1 {
    font-size: 2.8em;
    font-weight: 600;
    margin: 12px 0;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg,
        #ffffff 0%,
        #f0fff0 20%,
        #90ee90 40%,
        #32cd32 60%,
        #228b22 80%,
        #ffffff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow:
        -1px -1px 0 #6e6e73,
        1px -1px 0 #6e6e73,
        -1px 1px 0 #6e6e73,
        1px 1px 0 #6e6e73,
        -2px -2px 0 #6e6e73,
        2px -2px 0 #6e6e73,
        -2px 2px 0 #6e6e73,
        2px 2px 0 #6e6e73;
    -webkit-text-stroke: 1px #6e6e73;
    position: relative;
}

.app-header h1::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 3px;
    background: linear-gradient(90deg,
        rgba(255, 255, 255, 0.4) 0%,
        rgba(144, 238, 144, 0.6) 30%,
        rgba(50, 205, 50, 0.8) 50%,
        rgba(144, 238, 144, 0.6) 70%,
        rgba(255, 255, 255, 0.4) 100%);
    border-radius: 2px;
}

.app-header p {
    color: #6e6e73;
    font-size: 1.1em;
    margin: 8px 0 20px 0;
    font-weight: 400;
    letter-spacing: -0.01em;
}

.tech-stack {
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 15px;
}

.tech-icon {
    font-size: 1.1em;
    padding: 14px 18px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(12px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.4);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06),
        0 1px 3px rgba(0, 0, 0, 0.04);
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 65px;
    height: 65px;
    position: relative;
    overflow: hidden;
    font-weight: 500;
    color: #1d1d1f;
    letter-spacing: -0.01em;
}

.tech-icon::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
}

.tech-icon:hover::before {
    opacity: 1;
    animation: sparkle 0.8s ease-out;
}

.tech-icon::after {
    content: '✨';
    position: absolute;
    top: 5px;
    right: 5px;
    font-size: 0.6em;
    opacity: 0;
    animation: randomSparkle 8s ease-in-out infinite;
    pointer-events: none;
}

/* Individual icon colors - Apple-inspired subtle gradients */
.tech-icon[data-icon="html"] {
    background: linear-gradient(135deg, rgba(255, 102, 0, 0.08), rgba(255, 140, 0, 0.06));
    border-color: rgba(255, 102, 0, 0.15);
}

.tech-icon[data-icon="html"]:hover {
    background: linear-gradient(135deg, rgba(255, 102, 0, 0.15), rgba(255, 140, 0, 0.12));
    color: #ff6600;
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(255, 102, 0, 0.15);
}

.tech-icon[data-icon="css"] {
    background: linear-gradient(135deg, rgba(0, 115, 220, 0.08), rgba(0, 153, 255, 0.06));
    border-color: rgba(0, 115, 220, 0.15);
}

.tech-icon[data-icon="css"]:hover {
    background: linear-gradient(135deg, rgba(0, 115, 220, 0.15), rgba(0, 153, 255, 0.12));
    color: #0073dc;
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0, 115, 220, 0.15);
}

.tech-icon[data-icon="javascript"] {
    background: linear-gradient(135deg, rgba(255, 221, 0, 0.08), rgba(255, 203, 0, 0.06));
    border-color: rgba(255, 221, 0, 0.15);
}

.tech-icon[data-icon="javascript"]:hover {
    background: linear-gradient(135deg, rgba(255, 221, 0, 0.15), rgba(255, 203, 0, 0.12));
    color: #ffdd00;
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(255, 221, 0, 0.15);
}

.tech-icon[data-icon="typescript"] {
    background: linear-gradient(135deg, rgba(43, 116, 137, 0.08), rgba(66, 165, 245, 0.06));
    border-color: rgba(43, 116, 137, 0.15);
}

.tech-icon[data-icon="typescript"]:hover {
    background: linear-gradient(135deg, rgba(43, 116, 137, 0.15), rgba(66, 165, 245, 0.12));
    color: #2b7489;
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(43, 116, 137, 0.15);
}

.tech-icon[data-icon="react"] {
    background: linear-gradient(135deg, rgba(97, 218, 251, 0.08), rgba(97, 218, 251, 0.06));
    border-color: rgba(97, 218, 251, 0.15);
}

.tech-icon[data-icon="react"]:hover {
    background: linear-gradient(135deg, rgba(97, 218, 251, 0.15), rgba(97, 218, 251, 0.12));
    color: #61dafb;
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(97, 218, 251, 0.15);
}

.tech-icon[data-icon="vue"] {
    background: linear-gradient(135deg, rgba(76, 175, 80, 0.08), rgba(76, 175, 80, 0.06));
    border-color: rgba(76, 175, 80, 0.15);
}

.tech-icon[data-icon="vue"]:hover {
    background: linear-gradient(135deg, rgba(76, 175, 80, 0.15), rgba(76, 175, 80, 0.12));
    color: #4caf50;
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(76, 175, 80, 0.15);
}

.tech-icon[data-icon="nodejs"] {
    background: linear-gradient(135deg, rgba(104, 180, 81, 0.08), rgba(104, 180, 81, 0.06));
    border-color: rgba(104, 180, 81, 0.15);
}

.tech-icon[data-icon="nodejs"]:hover {
    background: linear-gradient(135deg, rgba(104, 180, 81, 0.15), rgba(104, 180, 81, 0.12));
    color: #68b451;
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(104, 180, 81, 0.15);
}

.tech-icon[data-icon="python"] {
    background: linear-gradient(135deg, rgba(53, 114, 165, 0.08), rgba(255, 214, 0, 0.06));
    border-color: rgba(53, 114, 165, 0.15);
}

.tech-icon[data-icon="python"]:hover {
    background: linear-gradient(135deg, rgba(53, 114, 165, 0.15), rgba(255, 214, 0, 0.12));
    color: #3572a5;
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(53, 114, 165, 0.15);
}

.tech-icon:hover {
    transform: scale(1.15) translateY(-8px);
    box-shadow:
        0 8px 25px rgba(102, 126, 234, 0.4),
        0 4px 12px rgba(102, 126, 234, 0.2),
        0 0 30px rgba(102, 126, 234, 0.1);
    border-color: rgba(102, 126, 234, 0.6);
    animation: hoverPulse 0.6s ease-out;
}

.tech-icon:hover .icon-text {
    animation: splitMotion 0.6s ease-out, textGlow 0.6s ease-out;
}

/* Random sparkle effect */
.tech-icon::after {
    content: '✨';
    position: absolute;
    top: 5px;
    right: 5px;
    font-size: 0.6em;
    opacity: 0;
    animation: randomSparkle 8s ease-in-out infinite;
    pointer-events: none;
    z-index: 1;
}

.ideas-stats {
    display: flex;
    justify-content: center;
    margin-bottom: 35px;
}

.stats-item {
    text-align: center;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(16px) saturate(180%);
    color: #1d1d1f;
    padding: 24px 35px;
    border-radius: 20px;
    box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.06),
        0 1px 4px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.4);
    position: relative;
    overflow: hidden;
}

.stats-item::before {
    content: '💡';
    position: absolute;
    top: -8px;
    right: -8px;
    font-size: 2.2em;
    opacity: 0.4;
}

.stats-number {
    display: block;
    font-size: 2.8em;
    font-weight: 700;
    margin-bottom: 6px;
    text-shadow: none;
    color: #007aff;
    letter-spacing: -0.02em;
}

.stats-label {
    font-size: 1em;
    opacity: 0.8;
    font-weight: 500;
    color: #6e6e73;
    letter-spacing: -0.01em;
}

h2 {
    text-align: center;
    color: #333;
    margin-bottom: 30px;
    font-size: 2em;
    font-weight: 300;
}

.ideas-list {
    margin-bottom: 30px;
}

.ideas-list ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

.idea-item {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    box-shadow:
        0 2px 12px rgba(0, 0, 0, 0.06),
        0 1px 4px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
}

.idea-item:hover {
    transform: translateY(-2px) scale(1.01);
    box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.08),
        0 2px 8px rgba(0, 0, 0, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    border-color: rgba(0, 122, 255, 0.2);
}

.idea-item::before {
    content: '💭';
    position: absolute;
    top: 15px;
    right: 15px;
    font-size: 1.2em;
    opacity: 0.6;
}

.idea-item strong {
    color: #2c3e50;
    font-size: 1.2em;
    display: block;
    margin-bottom: 10px;
    font-weight: 600;
}

.idea-content {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.success-icon {
    color: #28a745;
    font-size: 1.5em;
    font-weight: bold;
    opacity: 0;
    animation: checkmark 0.6s ease-out 0.3s forwards;
    margin-left: 10px;
}

@keyframes checkmark {
    from {
        opacity: 0;
        transform: scale(0.5) rotate(-180deg);
    }
    to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
    }
}

.idea-author {
    color: #5a6c7d;
    font-size: 0.95em;
    font-style: italic;
    font-weight: 400;
}

.idea-timestamp {
    color: #888;
    font-size: 0.85em;
    font-weight: 400;
    margin-top: 5px;
    display: block;
}

.add-idea-form {
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    border-radius: 20px;
    padding: 32px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow:
        0 2px 12px rgba(0, 0, 0, 0.06),
        0 1px 4px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
}

.button-group {
    display: flex;
    gap: 12px;
}

.button-group button {
    flex: 1;
    padding: 14px 18px;
    border: none;
    border-radius: 10px;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
}

.button-group button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s;
}

.button-group button:hover::before {
    left: 100%;
}

.clear-button {
    background: rgba(142, 142, 147, 0.12);
    color: #6e6e73;
    border: 1px solid rgba(142, 142, 147, 0.2);
}

.clear-button:hover {
    background: rgba(142, 142, 147, 0.2);
    color: #1d1d1f;
    transform: translateY(-2px);
    box-shadow:
        0 4px 16px rgba(142, 142, 147, 0.15),
        0 2px 8px rgba(142, 142, 147, 0.1);
}

input {
    width: 100%;
    padding: 16px 20px;
    margin-bottom: 20px;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 12px;
    font-size: 1em;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-sizing: border-box;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    font-family: inherit;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

input:focus {
    outline: none;
    border-color: #007aff;
    box-shadow:
        0 0 0 3px rgba(0, 122, 255, 0.1),
        0 2px 8px rgba(0, 122, 255, 0.08);
    background: rgba(255, 255, 255, 0.95);
    transform: translateY(-1px);
}

button {
    width: 100%;
    padding: 14px 16px;
    background: linear-gradient(135deg, #007aff 0%, #0056cc 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-sizing: border-box;
    font-family: inherit;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.01em;
    position: relative;
    overflow: hidden;
}

button:hover {
    transform: translateY(-2px);
    box-shadow:
        0 4px 16px rgba(0, 122, 255, 0.3),
        0 2px 8px rgba(0, 122, 255, 0.2);
    background: linear-gradient(135deg, #0056cc 0%, #004499 100%);
}

button:active {
    transform: translateY(0);
    box-shadow:
        0 2px 8px rgba(0, 122, 255, 0.2);
}

.app-footer {
    margin-top: 40px;
    padding-top: 28px;
    border-top: 1px solid rgba(0, 0, 0, 0.08);
    text-align: center;
    color: #6e6e73;
    font-size: 0.95em;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(12px) saturate(180%);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    border-radius: 16px;
    padding: 24px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow:
        0 2px 12px rgba(0, 0, 0, 0.06),
        0 1px 4px rgba(0, 0, 0, 0.04);
}

.footer-links {
    margin-top: 12px;
}

.footer-links a {
    color: #007aff;
    text-decoration: none;
    margin: 0 14px;
    font-weight: 500;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    letter-spacing: -0.01em;
}

.footer-links a:hover {
    text-decoration: none;
    color: #0056cc;
    transform: translateY(-1px);
}

/* Floating animation for decorative elements */
@keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
}

.logo svg {
    animation: float 3s ease-in-out infinite;
}

/* Enhanced live animations for tech icons */
.tech-icon:nth-child(1) {
    animation: float 3s ease-in-out infinite, gentleGlow 4s ease-in-out infinite;
}
.tech-icon:nth-child(2) {
    animation: float 3.2s ease-in-out infinite, gentleRotate 5s linear infinite;
}
.tech-icon:nth-child(3) {
    animation: float 3.4s ease-in-out infinite, pulseScale 6s ease-in-out infinite;
}
.tech-icon:nth-child(4) {
    animation: float 3.6s ease-in-out infinite, colorShift 7s ease-in-out infinite;
}
.tech-icon:nth-child(5) {
    animation: float 3.8s ease-in-out infinite, gentleGlow 4.5s ease-in-out infinite;
}
.tech-icon:nth-child(6) {
    animation: float 4s ease-in-out infinite, gentleRotate 5.5s linear infinite reverse;
}
.tech-icon:nth-child(7) {
    animation: float 4.2s ease-in-out infinite, pulseScale 6.5s ease-in-out infinite;
}
.tech-icon:nth-child(8) {
    animation: float 4.4s ease-in-out infinite, colorShift 7.5s ease-in-out infinite;
}

/* Split motion animation for tech icons */
@keyframes splitMotion {
    0% {
        transform: scaleX(1);
        opacity: 1;
    }
    50% {
        transform: scaleX(0.8);
        opacity: 0.7;
    }
    100% {
        transform: scaleX(1);
        opacity: 1;
    }
}

/* Live motion animations for tech icons */
@keyframes gentleGlow {
    0%, 100% {
        box-shadow:
            0 2px 8px rgba(0, 0, 0, 0.06),
            0 1px 3px rgba(0, 0, 0, 0.04);
    }
    50% {
        box-shadow:
            0 2px 8px rgba(0, 0, 0, 0.08),
            0 1px 3px rgba(0, 0, 0, 0.06),
            0 0 20px rgba(102, 126, 234, 0.1);
    }
}

@keyframes gentleRotate {
    0% { transform: translateY(0px) rotate(0deg); }
    25% { transform: translateY(-5px) rotate(1deg); }
    50% { transform: translateY(-10px) rotate(0deg); }
    75% { transform: translateY(-5px) rotate(-1deg); }
    100% { transform: translateY(0px) rotate(0deg); }
}

@keyframes pulseScale {
    0%, 100% {
        transform: translateY(0px) scale(1);
    }
    50% {
        transform: translateY(-8px) scale(1.05);
    }
}

@keyframes colorShift {
    0%, 100% {
        filter: hue-rotate(0deg) brightness(1);
    }
    25% {
        filter: hue-rotate(5deg) brightness(1.1);
    }
    50% {
        filter: hue-rotate(0deg) brightness(1.2);
    }
    75% {
        filter: hue-rotate(-5deg) brightness(1.1);
    }
}

/* Interactive hover animations */
@keyframes hoverPulse {
    0% {
        transform: scale(1) translateY(0px);
    }
    50% {
        transform: scale(1.2) translateY(-10px);
    }
    100% {
        transform: scale(1.15) translateY(-8px);
    }
}

@keyframes textGlow {
    0% {
        text-shadow: none;
    }
    50% {
        text-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
    }
    100% {
        text-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
    }
}

/* Sparkle effect for hover */
@keyframes sparkle {
    0% {
        transform: scale(0) rotate(0deg);
        opacity: 1;
    }
    50% {
        transform: scale(1) rotate(180deg);
        opacity: 0.8;
    }
    100% {
        transform: scale(0) rotate(360deg);
        opacity: 0;
    }
}

/* Random sparkle particles */
@keyframes randomSparkle {
    0%, 85%, 100% {
        opacity: 0;
        transform: scale(0) rotate(0deg);
    }
    10%, 20% {
        opacity: 0.6;
        transform: scale(1) rotate(90deg);
    }
    30%, 40% {
        opacity: 0.8;
        transform: scale(0.8) rotate(180deg);
    }
    50%, 60% {
        opacity: 0.4;
        transform: scale(1.2) rotate(270deg);
    }
    70%, 80% {
        opacity: 0.7;
        transform: scale(0.9) rotate(360deg);
    }
}

/* Pulse animation for stats */

    0% { transform: scale(1); }
    50% { transform: scale(1.05); }

}

.stats-item:hover {

}

/* Enhanced button hover effects */

}

}

/* Decorative background elements - Apple-inspired subtle effects */
body::after {

    left: 0;
    width: 100%;
    height: 100%;

        radial-gradient(circle at 50% 50%, rgba(144, 238, 144, 0.03) 0%, transparent 50%);

}

@keyframes backgroundFloat {
    0%, 100% { transform: translateY(0px) rotate(0deg); }

}

}

.notification-icon {
    font-size: 1.5em;
    margin-right: 12px;
}

.notification-text {

    font-weight: 500;
}

@keyframes bounceIn {

        transform: translateX(0) scale(0.3);
        opacity: 0;
    }
    50% {
        transform: translateX(0) scale(1.05);
    }
    70% {

    }
}

<script>
console.log('Script loaded successfully');

// All event listeners are attached after DOM is loaded
document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM loaded');
    console.log('Add button:', document.getElementById('add-btn'));
    console.log('Idea input:', document.getElementById('idea-input'));
    console.log('Name input:', document.getElementById('name-input'));

    // Auto-focus on idea input
    document.getElementById('idea-input').focus();

    // Clear button event listener
    document.getElementById('clear-btn').addEventListener('click', function() {
        console.log('Clear button clicked');
        document.getElementById('idea-input').value = '';
        document.getElementById('name-input').value = '';
        document.getElementById('idea-input').focus();
    });

    // Add button event listener
    document.getElementById('add-btn').addEventListener('click', function() {
        console.log('Add button clicked!');

        const button = this;
        const ideaInput = document.getElementById('idea-input');
        const nameInput = document.getElementById('name-input');

        console.log('Input elements found:', ideaInput, nameInput);

        const idea = ideaInput.value.trim();
        const name = nameInput.value.trim();

        console.log('Idea:', idea, 'Name:', name);

        // Validation
        if (!idea) {
            alert('Please enter an idea!');
            ideaInput.focus();
            return;
        }

        if (!name) {
            alert('Please enter your name!');
            nameInput.focus();
            return;
        }

        // Check for duplicate ideas
        const existingIdeas = Array.from(document.querySelectorAll('.idea-item strong')).map(el => el.textContent.toLowerCase());
        console.log('Existing ideas:', existingIdeas);

        if (existingIdeas.includes(idea.toLowerCase())) {
            alert('This idea has already been suggested!');
            return;
        }

        // Add success animation to button
        button.style.animation = 'buttonSuccess 0.6s ease';
        button.textContent = '✓ Submitted!';

        setTimeout(() => {
            button.textContent = 'Submit Idea';
            button.style.animation = '';
        }, 1500);

        // Add new idea to the list with animation and success icon (prepend to show first)
        const ul = document.querySelector('.ideas-list ul');
        console.log('UL element:', ul);

        // Get current timestamp
        const now = new Date();
        const timestamp = now.toLocaleString();

        const li = document.createElement('li');
        li.className = 'idea-item new-idea';
        li.innerHTML = `
            <div class="idea-content">
                <strong>${idea}</strong>
                <span class="success-icon">✓</span>
            </div>
            <span class="idea-author">Suggested by ${name}</span>
            <span class="idea-timestamp">Submitted on ${timestamp}</span>
        `;

        // Prepend to show as first item
        ul.insertBefore(li, ul.firstChild);
        console.log('New idea added to top of list');

        // Update counter with animation
        const counter = document.getElementById('total-ideas');
        const currentCount = parseInt(counter.textContent);
        counter.textContent = currentCount + 1;

        // Animate the counter
        counter.style.transform = 'scale(1.2)';
        setTimeout(() => {
            counter.style.transform = 'scale(1)';
        }, 200);

        // Clear inputs and focus
        ideaInput.value = '';
        nameInput.value = '';
        ideaInput.focus();

        // Remove the 'new-idea' class after animation
        setTimeout(() => {
            li.classList.remove('new-idea');
        }, 500);

        // Open new tab with success message
        const newTab = window.open('', '_blank');
        if (newTab) {
            newTab.document.write(`
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Idea Planted in the Garden!</title>
                    <style>
                        body {
                            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
                            background: linear-gradient(135deg,
                                rgba(255, 255, 255, 0.4) 0%,
                                rgba(240, 255, 240, 0.5) 25%,
                                rgba(220, 255, 220, 0.4) 50%,
                                rgba(200, 255, 200, 0.5) 75%,
                                rgba(255, 255, 255, 0.4) 100%),
                                linear-gradient(180deg,
                                rgba(34, 139, 34, 0.08) 0%,
                                rgba(50, 205, 50, 0.06) 30%,
                                rgba(34, 139, 34, 0.04) 70%,
                                rgba(50, 205, 50, 0.08) 100%),
                                url('https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=1200&h=800&fit=crop&crop=center') no-repeat center center fixed;
                            background-size: cover;
                            margin: 0;
                            padding: 20px;
                            min-height: 100vh;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            color: #1d1d1f;
                            -webkit-font-smoothing: antialiased;
                            -moz-osx-font-smoothing: grayscale;
                            position: relative;
                        }
                        body::before {
                            content: '';
                            position: absolute;
                            top: 0;
                            left: 0;
                            right: 0;
                            bottom: 0;
                            background: rgba(255, 255, 255, 0.15);
                            backdrop-filter: blur(0.5px);
                            -webkit-backdrop-filter: blur(0.5px);
                            z-index: -1;
                        }
                        .success-container {
                            background: rgba(255, 255, 255, 0.9);
                            backdrop-filter: blur(20px) saturate(180%);
                            padding: 48px;
                            border-radius: 24px;
                            box-shadow:
                                0 8px 32px rgba(0, 0, 0, 0.08),
                                0 2px 8px rgba(0, 0, 0, 0.04),
                                inset 0 1px 0 rgba(255, 255, 255, 0.4);
                            text-align: center;
                            max-width: 520px;
                            border: 1px solid rgba(255, 255, 255, 0.3);
                            position: relative;
                            overflow: hidden;
                        }
                        .success-container::before {
                            content: '';
                            position: absolute;
                            top: -50%;
                            left: -50%;
                            width: 200%;
                            height: 200%;
                            background: radial-gradient(circle, rgba(34, 139, 34, 0.03) 0%, transparent 70%);
                            animation: natureGlow 4s ease-in-out infinite;
                            z-index: -1;
                        }
                        .success-icon {
                            font-size: 4.5em;
                            margin-bottom: 24px;
                            animation: natureGrow 1.5s ease-out;
                            color: #228B22;
                        }
                        .success-title {
                            font-size: 2.2em;
                            margin-bottom: 20px;
                            color: #1d1d1f;
                            font-weight: 600;
                            letter-spacing: -0.02em;
                        }
                        .idea-display {
                            background: rgba(34, 139, 34, 0.08);
                            padding: 24px;
                            border-radius: 16px;
                            margin: 24px 0;
                            border: 1px solid rgba(34, 139, 34, 0.1);
                            position: relative;
                        }
                        .idea-display::before {
                            content: '🌱';
                            position: absolute;
                            top: -10px;
                            right: -10px;
                            font-size: 1.5em;
                            animation: leafFloat 3s ease-in-out infinite;
                        }
                        .idea-text {
                            font-size: 1.3em;
                            font-weight: 600;
                            color: #1d1d1f;
                            margin-bottom: 12px;
                            letter-spacing: -0.01em;
                        }
                        .idea-author {
                            color: #6e6e73;
                            font-style: normal;
                            font-weight: 500;
                            letter-spacing: -0.01em;
                        }
                        .close-btn {
                            background: linear-gradient(135deg, #228B22 0%, #32CD32 100%);
                            color: white;
                            border: none;
                            padding: 14px 28px;
                            border-radius: 12px;
                            font-size: 1em;
                            cursor: pointer;
                            margin-top: 24px;
                            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                            font-family: inherit;
                            font-weight: 600;
                            letter-spacing: -0.01em;
                        }
                        .close-btn:hover {
                            transform: translateY(-2px);
                            box-shadow: 0 4px 16px rgba(34, 139, 34, 0.3);
                            background: linear-gradient(135deg, #32CD32 0%, #228B22 100%);
                        }
                        @keyframes natureGrow {
                            0% {
                                transform: scale(0.3) rotate(-180deg);
                                opacity: 0;
                            }
                            50% {
                                transform: scale(1.2) rotate(-90deg);
                                opacity: 0.7;
                            }
                            100% {
                                transform: scale(1) rotate(0deg);
                                opacity: 1;
                            }
                        }
                        @keyframes natureGlow {
                            0%, 100% {
                                transform: scale(1);
                                opacity: 0.03;
                            }
                            50% {
                                transform: scale(1.1);
                                opacity: 0.06;
                            }
                        }
                        @keyframes leafFloat {
                            0%, 100% {
                                transform: translateY(0px) rotate(0deg);
                            }
                            25% {
                                transform: translateY(-5px) rotate(5deg);
                            }
                            50% {
                                transform: translateY(-10px) rotate(0deg);
                            }
                            75% {
                                transform: translateY(-5px) rotate(-5deg);
                            }
                        }
                    </style>
                </head>
                <body>
                    <div class="success-container">
                        <div class="success-icon">🌿</div>
                        <h1 class="success-title">Idea Planted Successfully!</h1>
                        <div class="idea-display">
                            <div class="idea-text">"${idea}"</div>
                            <div class="idea-author">Planted by ${name}</div>
                        </div>
                        <p>Your creative seed has been planted in the Group Idea Garden!</p>
                        <button class="close-btn" onclick="window.close()">Return to Garden</button>
                    </div>
                </body>
                </html>
            `);
            newTab.document.close();
        } else {
            // Fallback to notification if pop-up is blocked
            showNotification(`✅ "${idea}" submitted successfully!`, 'success');
            alert('Please allow pop-ups for this site to see the success message in a new tab.');
        }

        console.log('Success message displayed in new tab');
    });
});

// Keyboard shortcuts (outside DOMContentLoaded since they can work immediately)
document.addEventListener('keydown', function(e) {
    // Ctrl+Enter to add idea
    if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        const addBtn = document.getElementById('add-btn');
        if (addBtn) addBtn.click();
    }

    // Escape to clear
    if (e.key === 'Escape') {
        const clearBtn = document.getElementById('clear-btn');
        if (clearBtn) clearBtn.click();
    }
});

// Enhanced notification system
function showNotification(message, type) {
    // Remove existing notifications
    const existingNotifications = document.querySelectorAll('.notification');
    existingNotifications.forEach(notification => notification.remove());

    // Create new notification
    const notification = document.createElement('div');
    notification.className = `notification ${type}`;
    notification.innerHTML = `
        <div class="notification-content">
            <span class="notification-icon">${type === 'success' ? '✅' : '❌'}</span>
            <span class="notification-text">${message}</span>
        </div>
    `;

    // Enhanced styling
    notification.style.position = 'fixed';
    notification.style.top = '24px';
    notification.style.right = '24px';
    notification.style.padding = '0';
    notification.style.borderRadius = '16px';
    notification.style.zIndex = '1000';
    notification.style.boxShadow = '0 4px 20px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.06)';
    notification.style.transform = 'translateX(100%)';
    notification.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
    notification.style.backdropFilter = 'blur(20px) saturate(180%)';
    notification.style.webkitBackdropFilter = 'blur(20px) saturate(180%)';
    notification.style.border = '1px solid rgba(255, 255, 255, 0.3)';
    notification.style.background = 'rgba(255, 255, 255, 0.9)';

    if (type === 'success') {
        notification.style.background = 'rgba(52, 199, 89, 0.95)';
    } else {
        notification.style.background = 'rgba(255, 59, 48, 0.95)';
    }

    document.body.appendChild(notification);

    // Animate in with bounce effect
    setTimeout(() => {
        notification.style.transform = 'translateX(0)';
    }, 100);

    // Add bounce animation
    setTimeout(() => {
        notification.style.animation = 'bounceIn 0.6s ease-out';
    }, 200);

    // Auto remove after 4 seconds
    setTimeout(() => {
        notification.style.transform = 'translateX(100%)';
        setTimeout(() => {
            if (notification.parentNode) {
                notification.parentNode.removeChild(notification);
            }
        }, 400);
    }, 4000);
}

// Add animation for new ideas
const style = document.createElement('style');
style.textContent = `

}

@keyframes slideIn {

        transform: translateY(-20px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}
`;
document.head.appendChild(style);
</script>

</head>
